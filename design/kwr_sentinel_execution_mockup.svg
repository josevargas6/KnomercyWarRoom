<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20282d"/>
      <stop offset="55%" stop-color="#151b20"/>
      <stop offset="100%" stop-color="#0d1115"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11161a"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="panelSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182128"/>
      <stop offset="100%" stop-color="#10161b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .shell { fill:url(#panel); stroke:#8aa4b3; stroke-width:1.25; rx:20; }
      .softpanel { fill:url(#panelSoft); stroke:#31414b; stroke-width:1; rx:14; }
      .title { fill:#7fd7ff; font-family: Georgia, 'Times New Roman', serif; font-weight:700; letter-spacing:1px; }
      .heading { fill:#d7b45d; font-family: Georgia, 'Times New Roman', serif; font-weight:700; letter-spacing:0.8px; }
      .text { fill:#eef2f5; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill:#95a3ae; font-family: Arial, Helvetica, sans-serif; }
      .blue { fill:#73c6ff; font-family: Arial, Helvetica, sans-serif; font-weight:700; }
      .green { fill:#52df79; font-family: Arial, Helvetica, sans-serif; font-weight:700; }
      .red { fill:#ff6565; font-family: Arial, Helvetica, sans-serif; font-weight:700; }
      .gold { fill:#d8b96b; font-family: Arial, Helvetica, sans-serif; font-weight:700; }
      .badgeText { fill:#f7fbff; font-family: Arial, Helvetica, sans-serif; font-size:17px; font-weight:700; letter-spacing:0.7px; }
      .small { font-size:16px; }
      .medium { font-size:22px; }
      .large { font-size:34px; font-weight:700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <path d="M0 0h1600v372c-134 39-261 49-378 30-102-17-176-50-272-57-96-8-178 11-261 36-137 41-274 80-465 28-67-18-140-27-224-12V0z" fill="#263138" opacity="0.76"/>
  <path d="M0 510c160-44 312 9 458 35 105 18 211 10 309-18 126-36 230-90 394-82 147 8 250 59 439 69v386H0z" fill="#10161b"/>

  <g filter="url(#shadow)">
    <rect x="274" y="74" width="498" height="716" class="shell"/>
    <text x="316" y="120" class="title medium">KWR SENTINEL</text>
    <text x="316" y="148" class="muted small">Player execution client</text>

    <rect x="580" y="102" width="144" height="34" rx="17" fill="#1d6a3a" stroke="#52df79" stroke-width="1.2"/>
    <text x="652" y="124" text-anchor="middle" class="badgeText">WINNING</text>
    <rect x="515" y="146" width="209" height="28" rx="14" fill="#17303a" stroke="#73c6ff" stroke-width="1.1"/>
    <text x="619" y="165" text-anchor="middle" class="badgeText" style="font-size:15px;">RAID CMD ONLINE</text>

    <text x="316" y="205" class="blue large">AB 1500</text>
    <text x="503" y="205" class="text large">-</text>
    <text x="546" y="205" class="red large">1180</text>
    <text x="316" y="236" class="muted medium">Hold BS + LM for 1 more cap cycle</text>

    <rect x="304" y="268" width="438" height="92" class="softpanel"/>
    <text x="324" y="298" class="heading small">MY JOB</text>
    <text x="324" y="332" class="text medium">LH FLOAT</text>
    <text x="324" y="353" class="muted small">Rotate only if BS loses numbers.</text>

    <rect x="304" y="376" width="438" height="92" class="softpanel"/>
    <text x="324" y="406" class="heading small">MOVE</text>
    <text x="324" y="440" class="text medium">STAY NEAR LH ROAD CUT</text>
    <text x="324" y="461" class="muted small">Do not overchase to farm or tunnel mid.</text>

    <rect x="304" y="484" width="438" height="92" class="softpanel"/>
    <text x="324" y="514" class="heading small">TARGET</text>
    <text x="324" y="548" class="text medium">CC Toxicmage</text>
    <text x="324" y="569" class="muted small">If no cast window, peel Deathwish off Huskie.</text>

    <rect x="304" y="592" width="438" height="80" class="softpanel"/>
    <text x="324" y="622" class="heading small">TO HOLD</text>
    <text x="324" y="654" class="text medium">Keep LH from flipping while BS stays stable.</text>

    <rect x="304" y="688" width="438" height="72" class="softpanel"/>
    <text x="324" y="718" class="heading small">ALERT</text>
    <text x="324" y="747" class="gold medium">HEALER IN RANGE  |  FC SAFE  |  CARD LIVE 4s</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="110" width="484" height="300" class="shell"/>
    <text x="874" y="152" class="title medium">LOCAL TARGET CONFIRMATION</text>
    <text x="874" y="181" class="muted small">Only one visual cue. No automation.</text>

    <g transform="translate(972,275)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#ffffff" stroke-width="5"/>
      <circle cx="0" cy="0" r="29" fill="none" stroke="#d9e8f5" stroke-width="3"/>
      <line x1="-88" y1="0" x2="-34" y2="0" stroke="#ffffff" stroke-width="2.4"/>
      <line x1="88" y1="0" x2="34" y2="0" stroke="#ffffff" stroke-width="2.4"/>
      <line x1="0" y1="-88" x2="0" y2="-34" stroke="#ffffff" stroke-width="2.4"/>
      <line x1="0" y1="88" x2="0" y2="34" stroke="#ffffff" stroke-width="2.4"/>
      <circle cx="0" cy="0" r="17" fill="#25303a"/>
      <path d="M0 -10 10 -2 6 12 -6 12 -10 -2z" fill="#f5f9ff"/>
      <text x="0" y="82" text-anchor="middle" class="text medium">Correct target</text>
      <text x="0" y="106" text-anchor="middle" class="muted small">White = current target matches CC or kill assignment.</text>
    </g>

    <g transform="translate(1198,275)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#ff6464" stroke-width="5"/>
      <circle cx="0" cy="0" r="29" fill="none" stroke="#ff9e9e" stroke-width="3"/>
      <line x1="-88" y1="0" x2="-34" y2="0" stroke="#ff6464" stroke-width="2.4"/>
      <line x1="88" y1="0" x2="34" y2="0" stroke="#ff6464" stroke-width="2.4"/>
      <line x1="0" y1="-88" x2="0" y2="-34" stroke="#ff6464" stroke-width="2.4"/>
      <line x1="0" y1="88" x2="0" y2="34" stroke="#ff6464" stroke-width="2.4"/>
      <circle cx="0" cy="0" r="17" fill="#3b2222"/>
      <path d="M-10 -10 10 10M10 -10 -10 10" stroke="#fff0f0" stroke-width="3"/>
      <text x="0" y="82" text-anchor="middle" class="text medium">Wrong target</text>
      <text x="0" y="106" text-anchor="middle" class="muted small">Red = player is on the wrong enemy.</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="446" width="484" height="252" class="shell"/>
    <text x="874" y="488" class="title medium">BOUNDARY LOCK</text>
    <text x="874" y="520" class="heading small">Sentinel does</text>
    <text x="1040" y="520" class="heading small">Sentinel does not</text>

    <g class="text small">
      <text x="874" y="558">- collect visible local evidence</text>
      <text x="874" y="588">- show one execution card</text>
      <text x="874" y="618">- confirm target correctness</text>
      <text x="874" y="648">- show maintain or recover state</text>
    </g>

    <g class="muted small">
      <text x="1040" y="558">- replace Reporter</text>
      <text x="1040" y="588">- replace battleground enemy addons</text>
      <text x="1040" y="618">- make strategic decisions</text>
      <text x="1040" y="648">- automate target or spell actions</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="724" width="484" height="78" class="shell"/>
    <text x="874" y="760" class="heading small">Product line</text>
    <text x="874" y="789" class="text medium">Data collector + compact execution card + target confirmation</text>
  </g>

  <text x="800" y="860" text-anchor="middle" class="muted medium">Sentinel mockup direction: clean player card, commander-fed target cue, and no broad battleground UI replacement.</text>
</svg>
