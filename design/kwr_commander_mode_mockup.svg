  <text x="800" y="885" text-anchor="middle" class="muted medium">KWR visual target mockup — preserve current addon identity, modernize for WoW Midnight-era clarity, and restrict battlefield overlays to nameplates, rings, and reticle only in battlegrounds.</text>
