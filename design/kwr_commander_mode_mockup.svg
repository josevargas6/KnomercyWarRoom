<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334247"/>
      <stop offset="56%" stop-color="#1e272c"/>
      <stop offset="100%" stop-color="#11171b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f12"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .panel { fill:url(#panel); stroke:#9b7a28; stroke-width:1.2; rx:14; }
      .title { fill:#f0d487; font-family: Georgia, 'Times New Roman', serif; font-weight:700; letter-spacing:1px; }
      .gold { fill:#d6a63a; font-family: Georgia, 'Times New Roman', serif; font-weight:700; }
      .soft { fill:#d8dde2; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill:#8a959d; font-family: Arial, Helvetica, sans-serif; }
      .blue { fill:#4aa3ff; font-family: Arial, Helvetica, sans-serif; font-weight:700; }
      .red { fill:#ff5a5a; font-family: Arial, Helvetica, sans-serif; font-weight:700; }
      .green { fill:#53e571; font-family: Arial, Helvetica, sans-serif; font-weight:700; }
      .white { fill:#f5f6f7; font-family: Arial, Helvetica, sans-serif; }
      .small { font-size:15px; }
      .medium { font-size:19px; }
      .large { font-size:28px; font-weight:700; }
      .rowname { fill:#d9e0e6; font-family: Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; }
      .rowmeta { fill:#97a7b3; font-family: Arial, Helvetica, sans-serif; font-size:14px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

