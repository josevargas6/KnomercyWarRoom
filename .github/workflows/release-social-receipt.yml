name: KWR Release Social Receipt

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published candidate version.
        required: true
        default: 6.1.0-alpha.33
      post_discord:
        description: Post corrected announcement and ops receipts.
        required: true
        type: boolean
        default: false
      confirm_external_writes:
        description: Type PUBLISH to permit Discord posts.
        required: false
        default: ""

concurrency:
  group: kwr-release-social-receipt
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  receipt:
    runs-on: windows-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate exact release copy
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -cne "6.1.0-alpha.33") {
              throw "This receipt is certified only for 6.1.0-alpha.33."
          }
          ./tools/test-social-copy.ps1
          ./tools/kwr-commander-discord-announce.ps1 -Section announcements -Version $env:RELEASE_VERSION -DryRun
          ./tools/kwr-commander-discord-announce.ps1 -Section ops -Version $env:RELEASE_VERSION -DryRun
          ./tools/sentinel-discord-announce.ps1 -Section announcements -Version $env:RELEASE_VERSION -CommanderVersion $env:RELEASE_VERSION -DryRun
          ./tools/sentinel-discord-announce.ps1 -Section ops -Version $env:RELEASE_VERSION -CommanderVersion $env:RELEASE_VERSION -DryRun

      - name: Confirm external writes
        if: ${{ inputs.post_discord }}
        shell: pwsh
        env:
          CONFIRM_EXTERNAL_WRITES: ${{ inputs.confirm_external_writes }}
        run: |
          if ($env:CONFIRM_EXTERNAL_WRITES -cne "PUBLISH") {
              throw "Discord posts require confirm_external_writes=PUBLISH."
          }

      - name: Post Commander announcement
        if: ${{ inputs.post_discord }}
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS || secrets.WEBHOOK_ANNOUNCEMENTS }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/kwr-commander-discord-announce.ps1 -Section announcements -Version $env:RELEASE_VERSION

      - name: Post Sentinel announcement
        if: ${{ inputs.post_discord }}
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS || secrets.WEBHOOK_ANNOUNCEMENTS }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/sentinel-discord-announce.ps1 -Section announcements -Version $env:RELEASE_VERSION -CommanderVersion $env:RELEASE_VERSION

      - name: Post Commander ops receipt
        if: ${{ inputs.post_discord }}
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_OPS || secrets.OPS_HOOK }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/kwr-commander-discord-announce.ps1 -Section ops -Version $env:RELEASE_VERSION

      - name: Post Sentinel ops receipt
        if: ${{ inputs.post_discord }}
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_OPS || secrets.OPS_HOOK }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/sentinel-discord-announce.ps1 -Section ops -Version $env:RELEASE_VERSION -CommanderVersion $env:RELEASE_VERSION
