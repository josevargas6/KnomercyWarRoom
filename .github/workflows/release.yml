name: KWR Tagged Prerelease

on:
  push:
    tags:
      - "v*"
    branches:
      - "launch/6.1.0-alpha.32-final"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        default: v6.1.0-alpha.32

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'v6.1.0-alpha.32' }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Lua test runtime
        run: npm install --global fengari-node-cli

      - name: Run complete release gate
        shell: pwsh
        run: |
          ./tools/validate.ps1
          ./tools/security-audit.ps1
          ./tools/knowledge-audit.ps1
          ./tools/test-automation.ps1
          fengari tests/smoke.lua
          fengari tests/soak.lua

      - name: Validate tag matches addon version
        shell: pwsh
        run: |
          $tocVersion = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $expectedTag = "v$($tocVersion)"
          $releaseTag = "${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'v6.1.0-alpha.32' }}"
          if ($releaseTag -ne $expectedTag) {
              throw "Release tag mismatch. Expected $expectedTag but got $releaseTag."
          }
          $checkedOutTag = (git describe --tags --exact-match HEAD 2>$null | Select-Object -First 1)
          if ($checkedOutTag -ne $releaseTag) {
              throw "Release source mismatch. Expected checkout at $releaseTag but HEAD resolves to '$checkedOutTag'."
          }

      - name: Build and certify packages
        shell: pwsh
        run: ./tools/build.ps1 -OutputDirectory "${{ github.workspace }}/artifacts" -IncludeSentinel

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'v6.1.0-alpha.32' }}"
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $releaseTag artifacts/* --clobber
              gh release edit $releaseTag --prerelease --title "Knomercy War Room $releaseTag"
          } else {
              gh release create $releaseTag artifacts/* --prerelease --generate-notes --title "Knomercy War Room $releaseTag"
          }

      - name: Upload Commander to CurseForge
        shell: pwsh
        env:
          CURSEFORGE_PROJECT_ID: "1632632"
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_GAME_VERSION_IDS: ${{ vars.CURSEFORGE_GAME_VERSION_IDS || secrets.CURSEFORGE_GAME_VERSION_IDS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_API_TOKEN)) {
              throw "CurseForge upload is not configured: add CURSEFORGE_API_TOKEN to the production environment secrets."
          }
          if ($env:CURSEFORGE_GAME_VERSION_IDS -notmatch '^\s*\d+(\s*,\s*\d+)*\s*$') {
              throw "CurseForge upload blocked: CURSEFORGE_GAME_VERSION_IDS must be a comma-separated list of numeric CurseForge version IDs."
          }
          $version = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $safe = $version.ToUpperInvariant().Replace('.', '_').Replace('-', '_')
          ./tools/curseforge-upload-commander.ps1 -ArtifactPath "${{ github.workspace }}\artifacts\KWR_${safe}_DISTRIBUTION.zip"

      - name: Upload Sentinel to CurseForge
        shell: pwsh
        env:
          CURSEFORGE_PROJECT_ID: "1614463"
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_GAME_VERSION_IDS: ${{ vars.CURSEFORGE_GAME_VERSION_IDS || secrets.CURSEFORGE_GAME_VERSION_IDS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_API_TOKEN)) {
              throw "CurseForge upload is not configured: add CURSEFORGE_API_TOKEN to the production environment secrets."
          }
          if ($env:CURSEFORGE_GAME_VERSION_IDS -notmatch '^\s*\d+(\s*,\s*\d+)*\s*$') {
              throw "CurseForge upload blocked: CURSEFORGE_GAME_VERSION_IDS must be a comma-separated list of numeric CurseForge version IDs."
          }
          $version = ((Get-Content "KWRSentinel\KWRSentinel.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $safe = $version.ToUpperInvariant().Replace('.', '_').Replace('-', '_')
          ./tools/curseforge-upload-sentinel.ps1 -ArtifactPath "${{ github.workspace }}\artifacts\KWRSentinel_${safe}.zip"

      - name: Publish Commander Discord announcement
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS || secrets.WEBHOOK_ANNOUNCEMENTS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
              Write-Output "Discord announcement skipped: webhook secret is not configured."
              exit 0
          }
          $version = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          ./tools/kwr-commander-discord-announce.ps1 -Section announcements -Version $version

      - name: Publish Sentinel Discord announcement
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS || secrets.WEBHOOK_ANNOUNCEMENTS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
              Write-Output "Discord announcement skipped: webhook secret is not configured."
              exit 0
          }
          $version = ((Get-Content "KWRSentinel\KWRSentinel.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          ./tools/sentinel-discord-announce.ps1 -Section announcements -Version $version

      - name: Mint KWR Automation installation token
        id: kwr-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KWR_AUTOMATION_APP_ID || secrets.KWR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.KWR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: josevargas6
          repositories: kwr-sentinel-bot

      - name: Notify KWR Sentinel Discord bot
        shell: pwsh
        env:
          BOT_DISPATCH_TOKEN: ${{ steps.kwr-app-token.outputs.token }}
          BOT_REPOSITORY: ${{ vars.KWR_BOT_REPOSITORY || secrets.KWR_BOT_REPOSITORY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BOT_DISPATCH_TOKEN) -or [string]::IsNullOrWhiteSpace($env:BOT_REPOSITORY)) {
              throw "Sentinel bot notification blocked: GitHub App dispatch credentials are not configured."
          }
          $headers = @{
              Authorization = "Bearer $env:BOT_DISPATCH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $payload = @{
              event_type = "kwr_release_published"
              client_payload = @{
                  automation_role = "discord-execution-transport"
                  codex_authority = "implementation-and-publication"
                  codex_handoff = "github-review-only"
                  payload_version = 1
                  commander_version = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
                  sentinel_version = ((Get-Content "KWRSentinel\KWRSentinel.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
                  release_tag = "${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'v6.1.0-alpha.32' }}"
                  release_url = "https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'v6.1.0-alpha.32' }}"
                  source_urls = @(
                      "https://github.com/${{ github.repository }}"
                      "https://www.curseforge.com/wow/addons/knomercy-war-room"
                      "https://www.curseforge.com/wow/addons/kwr-sentinel"
                  )
                  confidence = "confirmed"
              }
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:BOT_REPOSITORY/dispatches" -Headers $headers -ContentType "application/json" -Body $payload
