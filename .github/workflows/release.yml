name: KWR Tagged Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Matches CI: publication must not cut off the complete reproducibility
    # and extracted-package certification after its release gates pass.
    timeout-minutes: 30
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Lua test runtime
        run: npm install --global fengari-node-cli

      - name: Run complete release gate
        shell: pwsh
        run: |
          ./tools/validate.ps1
          ./tools/security-audit.ps1
          ./tools/knowledge-audit.ps1
          ./tools/test-automation.ps1
          fengari tests/smoke.lua
          fengari tests/soak.lua

      - name: Validate tag matches addon version
        shell: pwsh
        run: |
          $tocVersion = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $expectedTag = "v$($tocVersion)"
          $releaseTag = "${{ inputs.release_tag || github.ref_name }}"
          if ($releaseTag -ne $expectedTag) {
              throw "Release tag mismatch. Expected $expectedTag but got $releaseTag."
          }
          $checkedOutTag = (git describe --tags --exact-match HEAD 2>$null | Select-Object -First 1)
          if ($checkedOutTag -ne $releaseTag) {
              throw "Release source mismatch. Expected checkout at $releaseTag but HEAD resolves to '$checkedOutTag'."
          }

      - name: Build and certify packages
        shell: pwsh
        # Mirrors CI's bounded package gate. The build script emits archive,
        # reproducibility, extraction, smoke, and soak checkpoints so a
        # production approval never waits on an opaque long-running step.
        timeout-minutes: 25
        run: |
          ./tools/build.ps1 -OutputDirectory "${{ github.workspace }}/artifacts" -IncludeSentinel
          $version = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $safe = $version.ToUpperInvariant().Replace('.', '_').Replace('-', '_')
          ./tools/candidate-package-report.ps1 `
            -BuildOutputDirectory "${{ github.workspace }}/artifacts" `
            -OutFile "artifacts/KWR_${safe}_RELEASE_EVIDENCE.json" `
            -EvidenceScope release
          Copy-Item "docs/RELEASE_INSTALL.md" "artifacts/INSTALL.md"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "${{ inputs.release_tag || github.ref_name }}"
          $version = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $safe = $version.ToUpperInvariant().Replace('.', '_').Replace('-', '_')
          $sentinelVersion = ((Get-Content "KWRSentinel\KWRSentinel.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $sentinelSafe = $sentinelVersion.ToUpperInvariant().Replace('.', '_').Replace('-', '_')
          $isPrerelease = $version.Contains('-')
          # Never publish developer sources, screenshots, field evidence, or
          # generated certification reports to a player-facing release.
          $publicAssets = @(
            "artifacts/KnomercyWarRoom-$version.zip",
            "artifacts/KWR-Sentinel-$sentinelVersion.zip",
            "artifacts/KWR_${safe}_SHA256.txt",
            "artifacts/KWR_${safe}_PUBLIC_MANIFEST.json",
            "artifacts/INSTALL.md"
          )
          foreach ($asset in $publicAssets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Public release asset is missing: $asset" }
          }
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $releaseTag $publicAssets --clobber
              if ($isPrerelease) {
                  gh release edit $releaseTag --prerelease --latest=false --title "Knomercy War Room $releaseTag"
              } else {
                  gh release edit $releaseTag --prerelease=false --latest --title "Knomercy War Room $releaseTag"
              }
          } else {
              if ($isPrerelease) {
                  gh release create $releaseTag $publicAssets --prerelease --latest=false --generate-notes --title "Knomercy War Room $releaseTag"
              } else {
                  gh release create $releaseTag $publicAssets --latest --generate-notes --title "Knomercy War Room $releaseTag"
              }
          }

      - name: Upload Commander to CurseForge
        shell: pwsh
        env:
          CURSEFORGE_PROJECT_ID: "1632632"
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_GAME_VERSION_IDS: ${{ vars.CURSEFORGE_GAME_VERSION_IDS || secrets.CURSEFORGE_GAME_VERSION_IDS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_API_TOKEN)) {
              throw "CurseForge upload is not configured: add CURSEFORGE_API_TOKEN to the production environment secrets."
          }
          if ($env:CURSEFORGE_GAME_VERSION_IDS -notmatch '^\s*\d+(\s*,\s*\d+)*\s*$') {
              throw "CurseForge upload blocked: CURSEFORGE_GAME_VERSION_IDS must be a comma-separated list of numeric CurseForge version IDs."
          }
          $version = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $safe = $version.ToUpperInvariant().Replace('.', '_').Replace('-', '_')
          $releaseType = if ($version.Contains('-')) { 'alpha' } else { 'release' }
          ./tools/curseforge-upload-commander.ps1 -ArtifactPath "${{ github.workspace }}\artifacts\KnomercyWarRoom-$version.zip" -ReleaseType $releaseType

      - name: Upload Sentinel to CurseForge
        shell: pwsh
        env:
          CURSEFORGE_PROJECT_ID: "1614463"
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_GAME_VERSION_IDS: ${{ vars.CURSEFORGE_GAME_VERSION_IDS || secrets.CURSEFORGE_GAME_VERSION_IDS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_API_TOKEN)) {
              throw "CurseForge upload is not configured: add CURSEFORGE_API_TOKEN to the production environment secrets."
          }
          if ($env:CURSEFORGE_GAME_VERSION_IDS -notmatch '^\s*\d+(\s*,\s*\d+)*\s*$') {
              throw "CurseForge upload blocked: CURSEFORGE_GAME_VERSION_IDS must be a comma-separated list of numeric CurseForge version IDs."
          }
          $version = ((Get-Content "KWRSentinel\KWRSentinel.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $safe = $version.ToUpperInvariant().Replace('.', '_').Replace('-', '_')
          $releaseType = if ($version.Contains('-')) { 'alpha' } else { 'release' }
          ./tools/curseforge-upload-sentinel.ps1 -ArtifactPath "${{ github.workspace }}\artifacts\KWR-Sentinel-$version.zip" -ReleaseType $releaseType

      - name: Publish Commander Discord announcement
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS || secrets.WEBHOOK_ANNOUNCEMENTS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
              throw "Discord release announcement is not configured: add DISCORD_WEBHOOK_ANNOUNCEMENTS or WEBHOOK_ANNOUNCEMENTS to the production environment secrets."
          }
          $version = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          ./tools/kwr-commander-discord-announce.ps1 -Section announcements -Version $version

      - name: Publish Sentinel Discord announcement
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS || secrets.WEBHOOK_ANNOUNCEMENTS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
              throw "Discord release announcement is not configured: add DISCORD_WEBHOOK_ANNOUNCEMENTS or WEBHOOK_ANNOUNCEMENTS to the production environment secrets."
          }
          $version = ((Get-Content "KWRSentinel\KWRSentinel.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          $commanderVersion = ((Get-Content "KnomercyWarRoom.toc" | Where-Object { $_ -match "^## Version:" }) -replace "^## Version:\s*", "").Trim()
          ./tools/sentinel-discord-announce.ps1 -Section announcements -Version $version -CommanderVersion $commanderVersion
