name: KWR CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kwr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: windows-latest
    # The release build performs a clean reproducibility build plus extracted
    # package smoke/soak. Keep the complete certification gate, but allow the
    # Windows runner enough time to finish it under normal runner contention.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Lua test runtime
        run: npm install --global fengari-node-cli

      - name: Scan workspace for committed credentials
        shell: pwsh
        run: ./tools/security-audit.ps1

      - name: Run autonomous offline certification
        shell: pwsh
        run: ./tools/certify-offline.ps1 -SkipBuild

      - name: Test release automation contracts
        shell: pwsh
        run: |
          ./tools/test-automation.ps1
          ./tools/test-deployment-manifest.ps1
          ./tools/test-retail-savedvariables-audit.ps1

      - name: Test public social copy
        shell: pwsh
        run: ./tools/test-social-copy.ps1

      - name: Build and extract-audit packages
        shell: pwsh
        # The build includes a clean reproducibility pass and extracts the
        # developer archive for runtime proof. A bounded step produces a
        # visible failure instead of indefinitely holding the merge policy.
        timeout-minutes: 25
        run: ./tools/build.ps1 -OutputDirectory "${{ github.workspace }}/artifacts" -IncludeSentinel

      - name: Upload public release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kwr-public-${{ github.run_id }}-${{ github.sha }}
          path: |
            artifacts/KnomercyWarRoom-*.zip
            artifacts/KWR-Sentinel-*.zip
            artifacts/KWR_*_SHA256.txt
            artifacts/KWR_*_PUBLIC_MANIFEST.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain developer package and private certification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kwr-developer-${{ github.run_id }}-${{ github.sha }}
          path: |
            artifacts/KWR_*_DEVELOPER.zip
            artifacts/KWR_*_DEVELOPER_CHECKSUM.txt
            artifacts/KWR_*_SOURCE_MANIFEST.json
            artifacts/KWR_*_BUILD_PROVENANCE.json
            artifacts/KWR_*_REPRODUCIBILITY.json
            artifacts/KWR_*_PACKAGE_AUDIT.json
          if-no-files-found: error
          retention-days: 30
